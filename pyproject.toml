[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spherewright-agent"
version = "0.1.0"
description = "User-configurable LLM driver with native Spherewright safety gates"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "httpx>=0.28,<1", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["ruff>=0.14,<1"]

[project.scripts]
sphere-agent = "sphere_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
